# Syncs this profile README from the snapshot generated by the portfolio repo
# (bojackduy/bojackduy.github.io, `npm run stats`). Runs monthly, a few hours
# after the portfolio refresh; can also be triggered manually.
name: refresh-stats

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest generated profile README
        run: |
          curl -sL --fail "https://raw.githubusercontent.com/bojackduy/bojackduy.github.io/main/stats-output/profile-README.md" -o /tmp/profile-README.md
          if ! cmp -s /tmp/profile-README.md README.md; then
            cp /tmp/profile-README.md README.md
            echo "changed=true" >> "$GITHUB_ENV"
          fi
      - name: Commit and push if changed
        if: env.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh GitHub stats snapshot"
          git push
